[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epistates"
dynamic = ["version"]
description = "Contractual supervision runtime for external agents"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["agent", "supervision", "contracts", "governance", "praxis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/kristhianmanue1/epistates"
Repository = "https://github.com/kristhianmanue1/epistates.git"
"Bug Tracker" = "https://github.com/kristhianmanue1/epistates/issues"
Changelog = "https://github.com/kristhianmanue1/epistates/blob/main/CHANGELOG.md"

[project.scripts]
epistates = "epistates.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "epistates._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Package data explicit (Slice3): canonical schemas and onboarding resources
# are distributed inside the wheel and read via importlib.resources. No repo
# checkout, no schemas//fixtures//docs/ at runtime.
[tool.setuptools.package-data]
epistates = [
    "data/schemas/*.schema.json",
    "data/onboarding/*.md",
    "data/onboarding/*.json",
]
